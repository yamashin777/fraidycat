<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Fraidycat Clone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <div class="logo" data-click="1" data-action="scrollMainToTop" style="cursor:pointer" title="トップに戻る">frady<span>cat</span><span class="logo-clone-badge">clone</span></div>
  <!-- スマホ用タグバー（PCでは非表示） -->
  <div class="mobile-tags" id="mobileTagsScroll"></div>
  <div class="hdr-actions">
    <button class="hdr-btn refresh" data-click="1" data-touchend="1" data-action="refreshAll">↻ 更新<span class="tooltip">全フィードを今すぐ更新</span></button>
    <button class="hdr-btn data" data-click="1" data-touchend="1" data-action="openImportModal">↑ テキスト登録<span class="tooltip">テキスト形式でチャンネルをまとめて登録</span></button>
    <button class="hdr-btn data" data-click="1" data-touchend="1" data-action="exportJSON">↓ JSONエクスポート<span class="tooltip">フォローデータをJSONファイルで書き出し</span></button>
    <button class="hdr-btn data" data-click="1" data-touchend="1" data-action="triggerImportJsonFile">↑ JSONインポート<span class="tooltip">JSONファイルからデータを読み込み</span></button>
    <button class="hdr-btn data" data-click="1" data-action="openLogModal">📋 ログ<span class="tooltip">取得ログ・成功率・プロキシ別統計を確認</span></button>
    <button class="hdr-btn data" data-click="1" data-action="openRevivalHistory">🎉 久しぶり<span class="tooltip">久しぶりに更新されたチャンネルの履歴（新着動画を検知した際、その投稿と直前の投稿の間隔が設定日数以上あいていた場合に表示されます。日数は履歴画面から変更可能）</span></button>
    <input type="file" id="importJsonFile" accept=".json" style="display:none" data-change="1" data-action="importJSON" data-args='["@evt"]'>
    <input type="file" id="importJsonFile" accept=".json" style="display:none" data-change="1" data-action="importJSON" data-args='["@evt"]'>
    <button class="hdr-btn api" data-click="1" data-touchend="1" data-action="openBulkFreqModal">⏱ 頻度一括変更<span class="tooltip">全チャンネルの更新頻度をまとめて変更</span></button>
    <button class="hdr-btn api" data-click="1" data-touchend="1" data-action="openApiKeyModal">🔑 APIキー<span class="tooltip">YouTube Data API v3のキーを設定</span></button>
    <button class="hdr-btn api" data-click="1" data-touchend="1" data-action="openSummaryApiKeyModal">🧠 要約APIキー<span class="tooltip">動画要約に使うGoogle Gemini APIキーを設定（無料枠あり）</span></button>
    <button class="hdr-btn api" data-click="1" data-touchend="1" data-action="openGhSettingsModal">🔄 GitHub同期<span class="tooltip">複数端末でデータを自動同期</span></button>
    <button class="hdr-btn api" data-click="1" data-touchend="1" data-action="bulkFetchDurations">▶ 時間一括取得<span class="tooltip">全YouTube動画の再生時間をAPIで一括取得</span></button>
    <button class="hdr-btn primary" data-click="1" data-touchend="1" data-action="openModal">+ 追加<span class="tooltip">新しいフォローを追加</span></button>
  </div>
  <!-- ハンバーガーボタンはボトムナビの☰から操作 -->
</div>

<!-- PCソートバー -->
<div class="sort-bar" id="sortBar">
  <span class="sort-bar-label">表示順：</span>
  <button class="sort-bar-btn" id="pcSortFreq"    data-click="1" data-action="setSortMode" data-args='["freq"]' title="全チャンネルを最新投稿日時の新しい順に表示">📋 チャンネル順</button>
  <button class="sort-bar-btn" id="pcSortLatest"  data-click="1" data-action="setSortMode" data-args='["latest"]' title="全動画を投稿日時の新しい順に表示">🕐 新着順</button>
  <button class="sort-bar-btn" id="pcSortDurDesc" data-click="1" data-action="setSortMode" data-args='["duration-desc"]' title="再生時間の長い動画から順に表示">⏬ 長い順</button>
  <button class="sort-bar-btn" id="pcSortDurAsc"  data-click="1" data-action="setSortMode" data-args='["duration-asc"]' title="再生時間の短い動画から順に表示">⏫ 短い順</button>
  <button class="sort-bar-btn" id="pcSortRegDesc" data-click="1" data-action="setSortMode" data-args='["registered-desc"]' title="最近登録したチャンネルを上に表示">🆕 登録新しい順</button>
  <button class="sort-bar-btn" id="pcSortRegAsc"  data-click="1" data-action="setSortMode" data-args='["registered-asc"]' title="最初に登録したチャンネルを上に表示">🕰 登録古い順</button>
  <button class="sort-bar-btn" id="pcSortSubDesc" data-click="1" data-action="setSortMode" data-args='["subscribers-desc"]' title="チャンネル登録者数の多い順に表示">👥 登録者数順</button>
  <button class="sort-bar-btn" id="pcSortFetchDesc" data-click="1" data-action="setSortMode" data-args='["fetched-desc"]' title="最近RSSを取得したチャンネルを上に表示">🔄 取得新しい順</button>
  <button class="sort-bar-btn" id="pcSortFetchAsc" data-click="1" data-action="setSortMode" data-args='["fetched-asc"]' title="取得が古いチャンネルを上に表示">⏳ 取得古い順</button>
  <div class="search-box">
    <input class="search-input" id="searchInput" type="text"
      placeholder="🔍 チャンネル名を検索..."
      data-input="1" data-action="setSearch" data-args='["@value"]'>
    <button class="search-clear" id="searchClear" data-click="1" data-action="clearSearch" style="display:none">✕</button>
  </div>
</div>

<!-- ドロワーメニュー（全ブラウザ対応） -->
<div class="drawer-backdrop" id="drawerBackdrop" data-click="1" data-action="closeDrawer"></div>
<div class="drawer" id="drawer">
  <!-- 検索欄（静的HTML・iPhoneで確実に動作） -->
  <div style="display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border-strong);border-radius:20px;padding:4px 12px;margin-bottom:4px">
    <span style="font-size:14px;flex-shrink:0">🔍</span>
    <input type="search" id="drawerSearchStatic"
      placeholder="チャンネル名を検索..."
      autocomplete="off" autocorrect="off" autocapitalize="off"
      style="border:none;outline:none;background:transparent;width:100%;font-size:16px;font-family:'DM Sans',sans-serif;color:var(--text);-webkit-user-select:text;user-select:text">
    <button id="drawerSearchClearStatic" style="display:none;background:none;border:none;color:var(--text-faint);font-size:14px;cursor:pointer;padding:0 2px;flex-shrink:0">✕</button>
  </div>
  <div id="drawerFreqFilter" style="display:flex;flex-direction:column;gap:2px"></div>
  <div class="drawer-title" style="margin-top:8px">操作</div>
  <button class="drawer-btn primary" data-click="1" data-touchend="1" data-action="openModalMobile">
    <span class="drawer-icon">＋</span>フォローを追加
  </button>
  <button class="drawer-btn" data-click="1" data-touchend="1" data-action="refreshAllMobile">
    <span class="drawer-icon">↻</span>すべて更新
  </button>
  <button class="drawer-btn" data-click="1" data-touchend="1" data-action="openLogModalMobile">
    <span class="drawer-icon">📋</span>取得ログ
  </button>
  <button class="drawer-btn" data-click="1" data-touchend="1" data-action="openRevivalHistoryMobile">
    <span class="drawer-icon">🎉</span>久しぶり更新の履歴
  </button>
  <div class="drawer-title">データ</div>
  <button class="drawer-btn" data-click="1" data-touchend="1" data-action="openGhSettingsModalMobile">
    <span class="drawer-icon">🔄</span>GitHub同期設定
  </button>
  <button class="drawer-btn" data-click="1" data-touchend="1" data-action="openApiKeyModalMobile">
    <span class="drawer-icon">🔑</span>YouTube APIキー設定
  </button>
  <button class="drawer-btn" data-click="1" data-touchend="1" data-action="bulkFetchDurationsMobile">
    <span class="drawer-icon">▶</span>動画時間を一括取得
  </button>
  <button class="drawer-btn" data-click="1" data-touchend="1" data-action="openBulkFreqModalMobile">
    <span class="drawer-icon">⏱</span>頻度を一括変更
  </button>
  <button class="drawer-btn" data-click="1" data-touchend="1" data-action="openImportModalMobile">
    <span class="drawer-icon">📋</span>テキスト登録
  </button>
  <button class="drawer-btn" data-click="1" data-touchend="1" data-action="exportJSONMobile">
    <span class="drawer-icon">↓</span>JSONエクスポート
  </button>
  <button class="drawer-btn" data-click="1" data-touchend="1" data-action="triggerImportJsonFileMobile">
    <span class="drawer-icon">↑</span>JSONインポート
  </button>
  <input type="file" id="importJsonFileMobile" accept=".json" style="display:none" data-change="1" data-action="importJSON" data-args='["@evt"]'>
  <input type="file" id="importJsonFileMobile" accept=".json" style="display:none" data-change="1" data-action="importJSON" data-args='["@evt"]'>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<!-- スマホ用ボトムナビ -->
<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="bnav-btn" id="bnavFreq" data-click="1" data-touchend="1" data-action="setSortMode" data-args='["freq"]'>
      <span class="bnav-icon">📋</span>CH順
    </button>
    <button class="bnav-btn" id="bnavLatest" data-click="1" data-touchend="1" data-action="setSortMode" data-args='["latest"]'>
      <span class="bnav-icon">🕐</span>新着
    </button>
    <button class="bnav-btn" id="bnavDurDesc" data-click="1" data-touchend="1" data-action="setSortMode" data-args='["duration-desc"]'>
      <span class="bnav-icon">⏬</span>長い
    </button>
    <button class="bnav-btn" id="bnavDurAsc" data-click="1" data-touchend="1" data-action="setSortMode" data-args='["duration-asc"]'>
      <span class="bnav-icon">⏫</span>短い
    </button>
    <button class="bnav-btn" data-click="1" data-touchend="1" data-action="refreshAll">
      <span class="bnav-icon">↻</span>更新
    </button>
    <button class="bnav-btn" data-click="1" data-touchend="1" data-action="openDrawer">
      <span class="bnav-icon">☰</span>メニュー
    </button>
  </div>
</div>

<div class="statusbar" id="statusbar" data-click="1" data-action="handleStatusbarClick" style="cursor:default">
  <div class="status-dot" id="statusDot"></div>
  <span id="statusText">準備完了</span>
  <span id="statusHint"></span>
  <span style="margin-left:auto;font-size:10px;color:var(--text-faint);font-family:'DM Mono',monospace">v2026.0815.1</span>
</div>

<div id="modalContainer"></div>

<script src="parser.js"></script>
<script src="fetcher.js"></script>
<script src="app.js"></script>
</body>
</html>
